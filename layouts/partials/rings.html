{{/* Rotating red rings, drawn as vectors so they stay sharp at any size. */}}
<svg class="rings" viewBox="-560 -560 1120 1120" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="ring-red" gradientUnits="userSpaceOnUse" x1="-500" y1="-500" x2="500" y2="500">
            <stop offset="0" stop-color="#c8102e"/>
            <stop offset="0.55" stop-color="#e63946"/>
            <stop offset="1" stop-color="#f2711c"/>
        </linearGradient>
    </defs>
    {{/* Outer rings: circles with one squared corner, so the turn is visible */}}
    <g class="ring-outer" stroke="url(#ring-red)" stroke-width="1.5">
        {{ range $i := seq 0 13 }}{{ $r := add 300 (mul $i 15) }}
        <path d="M0 -{{ $r }}A{{ $r }} {{ $r }} 0 1 0 {{ $r }} 0L{{ $r }} -{{ $r }}Z" opacity="{{ sub 1.0 (mul $i 0.06) }}"/>
        {{ end }}
    </g>
    {{/* Middle rings: dashed, turning the other way */}}
    <g class="ring-dashed" stroke-width="1.4" stroke-linecap="round">
        {{ range $i := seq 0 9 }}{{ $r := add 150 (mul $i 14) }}
        <circle r="{{ $r }}" stroke="{{ if modBool $i 2 }}#c8102e{{ else }}#f2711c{{ end }}" stroke-dasharray="{{ add 4 (mod $i 3) }} {{ add 7 (mod $i 4) }}"/>
        {{ end }}
    </g>
    {{/* Inner rings */}}
    <g class="ring-inner" stroke="#f2711c" stroke-width="1.3">
        {{ range $i := seq 0 8 }}{{ $r := add 22 (mul $i 13) }}
        <circle r="{{ $r }}" {{ if modBool $i 3 }}stroke-dasharray="2 5"{{ end }} opacity="{{ sub 1.0 (mul $i 0.05) }}"/>
        {{ end }}
    </g>
</svg>
