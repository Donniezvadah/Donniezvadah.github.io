<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/media/avatar.jpg">
    <title>{{ if .IsHome }}Donald Zvada | PhD student in Statistics{{ else }}{{ .Title }} | Donald Zvada{{ end }}</title>
    <meta name="description" content="{{ .Params.description | default site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:title" content="{{ if .IsHome }}Donald Zvada{{ else }}{{ .Title }} | Donald Zvada{{ end }}">
    <meta property="og:description" content="{{ .Params.description | default site.Params.description }}">
    <meta property="og:image" content="{{ "media/portrait.jpg" | absURL }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css?v={{ now.Unix }}">
</head>

<body{{ if .IsHome }} class="home"{{ end }}>
    {{ partial "rings.html" . }}
    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <script src="/js/main.js?v={{ now.Unix }}"></script>
</body>

</html>
