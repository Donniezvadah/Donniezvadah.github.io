<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 68" width="120" height="68">
  <!-- transition arrows between hidden states -->
  <line x1="31" y1="17" x2="45" y2="17" stroke="#2b7a8c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="49,17 43,13.5 43,20.5" fill="#2b7a8c"/>
  <line x1="71" y1="17" x2="85" y2="17" stroke="#2b7a8c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="89,17 83,13.5 83,20.5" fill="#2b7a8c"/>
  <!-- hidden states -->
  <circle cx="20" cy="17" r="11" fill="rgba(43,122,140,0.14)" stroke="#2b7a8c" stroke-width="3"/>
  <circle cx="60" cy="17" r="11" fill="rgba(43,122,140,0.14)" stroke="#2b7a8c" stroke-width="3"/>
  <circle cx="100" cy="17" r="11" fill="rgba(43,122,140,0.14)" stroke="#2b7a8c" stroke-width="3"/>
  <!-- emission arrows -->
  <line x1="20" y1="30" x2="20" y2="42" stroke="#349bb0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="20,47 16.5,41 23.5,41" fill="#349bb0"/>
  <line x1="60" y1="30" x2="60" y2="42" stroke="#349bb0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="60,47 56.5,41 63.5,41" fill="#349bb0"/>
  <line x1="100" y1="30" x2="100" y2="42" stroke="#349bb0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polygon points="100,47 96.5,41 103.5,41" fill="#349bb0"/>
  <!-- observations -->
  <rect x="13" y="49" width="14" height="14" rx="4" fill="#2b7a8c"/>
  <rect x="53" y="49" width="14" height="14" rx="4" fill="#2b7a8c"/>
  <rect x="93" y="49" width="14" height="14" rx="4" fill="#2b7a8c"/>
</svg>
